[package]
name = "salmonella-ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
salmonella-core = { path = "../../salmonella-core" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"
notify-rust = "4"

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
