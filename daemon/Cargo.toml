[package]
name = "salmonella-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
salmonella-core = { path = "../salmonella-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "4"
tokio = { version = "1", features = ["full"] }
dirs = "5"
infer = "0.19"
zvariant = "4.2"
# ponytail: notify 8 / debouncer-full 0.6 (not 7/mini) — only these are in the offline
# cargo cache; same API surface (new_debouncer, DebouncedEvent.event), debouncer-full
# additionally dedupes consecutive events per path.
notify = "8"
notify-debouncer-full = "0.6"
